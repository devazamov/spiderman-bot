<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Spidey Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0E14;
    --card:#141926;
    --card-hi:#1B2233;
    --red:#E4312B;
    --blue:#3B6BFF;
    --web:#C4CBDB;
    --amber:#F5A623;
    --text:#E8ECF3;
    --muted:#8A93A8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
    font-family:'Manrope',sans-serif;overflow-x:hidden;height:100%;}
  body{min-height:100vh;position:relative;}

  /* ambient web-line background */
  .bg-web{position:fixed;inset:0;z-index:0;opacity:.35;pointer-events:none;}
  .bg-web svg{width:100%;height:100%;}
  .bg-web path{stroke:var(--web);stroke-width:.6;fill:none;opacity:.5;}

  .skyline{position:fixed;left:0;right:0;bottom:0;height:22vh;z-index:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(11,14,20,0) 0%, rgba(11,14,20,.9) 60%, var(--ink) 100%);}
  .skyline svg{width:100%;height:100%;opacity:.55;}
  .skyline path{fill:#0F1420;}

  /* impact loader */
  #impact{position:fixed;inset:0;z-index:50;background:var(--ink);
    display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;}
  #impact svg{width:60vw;max-width:260px;}
  #impact.hide{opacity:0;pointer-events:none;}
  .impact-line{stroke:var(--red);stroke-width:1.4;fill:none;
    stroke-dasharray:220;stroke-dashoffset:220;animation:crack .7s ease-out forwards;}
  .impact-line:nth-child(2){animation-delay:.05s;stroke:var(--blue);}
  .impact-line:nth-child(3){animation-delay:.1s;}
  .impact-line:nth-child(4){animation-delay:.15s;stroke:var(--blue);}
  @keyframes crack{to{stroke-dashoffset:0;}}

  main{position:relative;z-index:1;padding:20px 16px 40px;max-width:520px;margin:0 auto;}

  header{text-align:center;padding:18px 0 8px;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:3px;color:var(--text);
    line-height:1;margin:0;}
  .logo span{color:var(--red);}
  .underline{width:64px;height:3px;background:linear-gradient(90deg,var(--red),var(--blue));
    margin:8px auto 10px;border-radius:2px;}
  .tagline{color:var(--muted);font-size:13px;margin:0;}

  /* admin yuklagan banner rasm (bor bo'lsa) */
  .hero-banner{display:none;position:relative;border-radius:18px;overflow:hidden;
    margin:4px 0 18px;border:1px solid #232B3D;
    box-shadow:0 0 0 1px rgba(228,49,43,.15), 0 10px 30px rgba(228,49,43,.12);}
  .hero-banner.show{display:block;animation:slidein .3s ease;}
  .hero-banner img{width:100%;height:170px;object-fit:cover;display:block;}
  .hero-banner::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(11,14,20,0) 40%, rgba(11,14,20,.85) 100%);}
  .hero-banner .corner-web{position:absolute;top:0;right:0;width:70px;height:70px;
    opacity:.5;pointer-events:none;}

  .list-banner{display:none;border-radius:14px;overflow:hidden;margin-bottom:14px;
    border:1px solid #232B3D;}
  .list-banner.show{display:block;animation:slidein .25s ease;}
  .list-banner img{width:100%;height:120px;object-fit:cover;display:block;}

  /* dekorativ o'rgimchak belgisi (original chizilgan, brendga tegishli emas) */
  .spider-mark{width:34px;height:34px;margin:0 auto 6px;opacity:.9;
    animation:float 3.2s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;position:relative;}
  .node{background:var(--card);border:1px solid #232B3D;border-radius:16px;padding:16px 14px;
    display:flex;flex-direction:column;gap:6px;cursor:pointer;user-select:none;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
    position:relative;overflow:hidden;}
  .node:active{transform:scale(.96);background:var(--card-hi);}
  .node .emoji{font-size:26px;}
  .node .title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;}
  .node .count{font-size:11px;color:var(--muted);}
  .node::after{content:"";position:absolute;top:-40%;right:-40%;width:80%;height:80%;
    background:radial-gradient(circle, rgba(228,49,43,.18), transparent 70%);}

  .list-view{display:none;}
  .list-view.active{display:block;animation:slidein .25s ease;}
  @keyframes slidein{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
  .home-view.hidden{display:none;}

  .back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);
    background:none;border:none;font-family:'Manrope';font-size:14px;padding:8px 0;cursor:pointer;}
  .list-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;margin:4px 0 14px;}

  .card{background:var(--card);border:1px solid #232B3D;border-radius:14px;padding:14px;
    margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
  .card .name{font-weight:800;font-size:15px;padding-right:26px;}
  .card .desc{font-size:13px;color:var(--muted);}
  .send-btn{align-self:flex-start;background:linear-gradient(90deg,var(--red),#ff5b52);
    color:#fff;border:none;border-radius:10px;padding:8px 16px;font-weight:800;font-size:13px;
    cursor:pointer;letter-spacing:.5px;}
  .send-btn:active{transform:scale(.96);}

  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}
  .empty .big{font-size:34px;display:block;margin-bottom:8px;}

  /* --- qidiruv paneli --- */
  .search-wrap{position:relative;margin:16px 0 4px;}
  .search-input{width:100%;background:var(--card);border:1px solid #232B3D;border-radius:12px;
    padding:12px 14px 12px 40px;color:var(--text);font-family:'Manrope';font-size:14px;outline:none;}
  .search-input:focus{border-color:var(--red);}
  .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6;font-size:15px;}
  .search-results{display:none;margin-top:10px;}
  .search-results.show{display:block;}

  /* --- eng ko'p ko'rilgan (top) qatori --- */
  .top-section{margin-top:26px;}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;
    display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .top-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .top-scroll::-webkit-scrollbar{display:none;}
  .top-card{flex:0 0 auto;width:118px;background:var(--card);border:1px solid #232B3D;
    border-radius:14px;padding:10px;cursor:pointer;position:relative;}
  .top-card .thumb{width:100%;height:70px;border-radius:9px;object-fit:cover;background:#1B2233;
    display:block;margin-bottom:6px;}
  .top-card .thumb-fallback{width:100%;height:70px;border-radius:9px;background:#1B2233;
    display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:6px;}
  .top-card .t-name{font-size:11.5px;font-weight:700;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .top-card .t-views{font-size:10px;color:var(--amber);margin-top:3px;}

  /* --- kontent kartochkasi: thumbnail + sevimli tugma --- */
  .card{position:relative;}
  .card .thumb-row{display:flex;gap:10px;align-items:center;}
  .card .thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#1B2233;}
  .card .thumb-fallback{width:52px;height:52px;border-radius:10px;background:#1B2233;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:22px;}
  .card .info{flex:1;min-width:0;}
  .fav-star{position:absolute;top:12px;right:12px;background:none;border:none;font-size:19px;
    cursor:pointer;line-height:1;padding:2px;opacity:.85;}
  .fav-star.active{filter:drop-shadow(0 0 4px rgba(245,166,35,.7));}
  .card .views-tag{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .btn-row{display:flex;gap:8px;align-items:center;margin-top:2px;}

  /* --- osilib turuvchi "kiyim yorlig'i" uslubidagi dekorativ rasm --- */
  .hang-tags{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .hang-tag{position:absolute;width:46px;opacity:.16;filter:grayscale(.15);}
  .hang-tag .string{width:1px;height:16px;background:var(--web);margin:0 auto;opacity:.7;}
  .hang-tag img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;
    border:1px solid rgba(196,203,219,.4);display:block;
    box-shadow:0 6px 10px rgba(0,0,0,.35);}
  .hang-tag .hole{width:5px;height:5px;border-radius:50%;background:var(--ink);
    border:1px solid rgba(196,203,219,.5);margin:2px auto 0;position:relative;z-index:1;top:9px;}
</style>
</head>
<body>

<div id="impact">
  <svg viewBox="0 0 200 200">
    <line class="impact-line" x1="100" y1="100" x2="20" y2="30"/>
    <line class="impact-line" x1="100" y1="100" x2="180" y2="40"/>
    <line class="impact-line" x1="100" y1="100" x2="30" y2="170"/>
    <line class="impact-line" x1="100" y1="100" x2="175" y2="160"/>
  </svg>
</div>

<div class="bg-web" id="bgWeb"></div>
<div class="hang-tags" id="hangTags"></div>
<div class="skyline">
  <svg viewBox="0 0 400 100" preserveAspectRatio="none">
    <path d="M0,100 L0,60 L20,60 L20,40 L40,40 L40,55 L60,55 L60,20 L80,20 L80,50 L110,50 L110,30 L130,30 L130,60 L150,60 L150,45 L170,45 L170,65 L200,65 L200,25 L220,25 L220,55 L250,55 L250,35 L270,35 L270,60 L300,60 L300,45 L320,45 L320,20 L340,20 L340,55 L360,55 L360,40 L380,40 L380,60 L400,60 L400,100 Z"/>
  </svg>
</div>

<main>
  <div class="home-view" id="homeView">
    <div class="hero-banner" id="heroBanner">
      <img id="heroBannerImg" alt="banner" />
      <svg class="corner-web" viewBox="0 0 100 100">
        <path d="M100,0 L100,100 M100,20 L60,0 M100,45 L35,0 M100,70 L15,0 M100,95 L0,0" stroke="#E8ECF3" stroke-width="1" fill="none" opacity=".6"/>
        <path d="M92,8 Q70,10 60,25 M85,15 Q65,20 50,40 M78,22 Q60,30 42,52" stroke="#E8ECF3" stroke-width="1" fill="none" opacity=".5"/>
      </svg>
    </div>
    <header>
      <svg class="spider-mark" viewBox="0 0 40 40">
        <circle cx="20" cy="18" r="6" fill="#E4312B"/>
        <circle cx="20" cy="28" r="8" fill="#E4312B"/>
        <g stroke="#0B0E14" stroke-width="1.3">
          <line x1="20" y1="12" x2="8" y2="6"/><line x1="20" y1="12" x2="32" y2="6"/>
          <line x1="14" y1="20" x2="2" y2="18"/><line x1="26" y1="20" x2="38" y2="18"/>
          <line x1="14" y1="30" x2="3" y2="34"/><line x1="26" y1="30" x2="37" y2="34"/>
          <line x1="16" y1="36" x2="12" y2="40"/><line x1="24" y1="36" x2="28" y2="40"/>
        </g>
      </svg>
      <h1 class="logo">SPIDEY <span>HUB</span></h1>
      <div class="underline"></div>
      <p class="tagline">Butun Spider-Man olami — bitta tarmoqda 🕸</p>
    </header>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Qidirish... (masalan: Venom)" />
    </div>
    <div class="search-results" id="searchResults"></div>

    <div class="grid" id="grid"></div>

    <div class="top-section" id="topSection" style="display:none;">
      <div class="section-title">🔥 Eng ko'p ko'rilgan</div>
      <div class="top-scroll" id="topScroll"></div>
    </div>
  </div>

  <div class="list-view" id="listView">
    <button class="back-btn" onclick="showHome()">← Bosh menyu</button>
    <div class="list-banner" id="listBanner"><img id="listBannerImg" alt="banner" /></div>
    <div class="list-title" id="listTitle"></div>
    <div id="listItems"></div>
  </div>
</main>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const API = ""; // aiohttp bot bilan bir domenda joylashgani uchun bo'sh
const USER_ID = tg?.initDataUnsafe?.user?.id || 0;

// ---- ambient web lines ----
(function drawWeb(){
  const svg = document.getElementById('bgWeb');
  const paths = [];
  for(let i=0;i<6;i++){
    const x1=Math.random()*100,y1=Math.random()*100;
    const x2=Math.random()*100,y2=Math.random()*100;
    paths.push(`<path d="M${x1},${y1} L${x2},${y2}" />`);
  }
  svg.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${paths.join('')}</svg>`;
})();

// ---- impact loader ----
setTimeout(()=>document.getElementById('impact').classList.add('hide'), 700);

// ---- sound + haptics ----
let audioCtx;
function thwip(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(900, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.16);
  }catch(e){}
  tg?.HapticFeedback?.impactOccurred('light');
}

// ---- data ----
const CATS = [
  {key:'filmlar', title:'Filmlar', emoji:'🎬'},
  {key:'seriallar', title:'Seriallar', emoji:'📺'},
  {key:'multfilmlar', title:'Multfilmlar', emoji:'🎨'},
  {key:'stikerlar', title:'Stikerlar', emoji:'🖼'},
  {key:'emojilar', title:'Emojilar', emoji:'😀'},
  {key:'videolar', title:'Videolar', emoji:'🎥'},
];

async function loadCounts(){
  try{
    const res = await fetch(`${API}/api/categories`);
    const data = await res.json();
    return Object.fromEntries(data.map(d=>[d.key, d.count]));
  }catch(e){ return {}; }
}

// admin bot orqali yuklagan banner rasmni bor bo'lsa ko'rsatadi, bo'lmasa jim o'tkazib yuboradi
function tryLoadBanner(key, containerId, imgId){
  const container = document.getElementById(containerId);
  const img = document.getElementById(imgId);
  const test = new Image();
  test.onload = () => { img.src = `${API}/api/banner/${key}`; container.classList.add('show'); };
  test.onerror = () => { container.classList.remove('show'); };
  test.src = `${API}/api/banner/${key}?t=${Date.now()}`;
}

function renderGrid(counts){
  const grid = document.getElementById('grid');
  grid.innerHTML = CATS.map(c => `
    <div class="node" onclick="openCategory('${c.key}','${c.title}')">
      <div class="emoji">${c.emoji}</div>
      <div class="title">${c.title}</div>
      <div class="count">${counts[c.key] ?? 0} ta</div>
    </div>
  `).join('') + `
    <div class="node" onclick="openFavorites()">
      <div class="emoji">⭐</div>
      <div class="title">Sevimlilar</div>
      <div class="count">saqlanganlar</div>
    </div>
  `;
}

function thumbHtml(it){
  if(it.has_thumb){
    return `<img class="thumb" src="${API}/api/thumb/${it.id}" alt="" onerror="this.outerHTML='<div class=\\'thumb-fallback\\'>🕷</div>'" />`;
  }
  const icons = {video:'🎬', photo:'🖼', animation:'🎞', sticker:'🕸', voice:'🎙', audio:'🎵', document:'📄'};
  return `<div class="thumb-fallback">${icons[it.file_type] || '🕷'}</div>`;
}

function cardHtml(it){
  return `
    <div class="card" id="card-${it.id}">
      <button class="fav-star ${it.is_favorite ? 'active' : ''}" id="fav-${it.id}" onclick="toggleFavorite(${it.id})">${it.is_favorite ? '⭐' : '☆'}</button>
      <div class="thumb-row">
        ${thumbHtml(it)}
        <div class="info">
          <div class="name">🕷 ${escapeHtml(it.title)}</div>
          ${it.description ? `<div class="desc">${escapeHtml(it.description)}</div>` : ''}
          ${it.views ? `<div class="views-tag">👁 ${it.views} marta ko'rilgan</div>` : ''}
        </div>
      </div>
      <div class="btn-row">
        <button class="send-btn" onclick="sendItem(${it.id})">Chatga yuborish</button>
      </div>
    </div>
  `;
}

async function openCategory(key, title){
  thwip();
  document.getElementById('homeView').classList.add('hidden');
  const listView = document.getElementById('listView');
  listView.classList.add('active');
  document.getElementById('listTitle').textContent = title;
  tryLoadBanner(key, 'listBanner', 'listBannerImg');
  const itemsEl = document.getElementById('listItems');
  itemsEl.innerHTML = '<div class="empty">Yuklanmoqda...</div>';

  try{
    const res = await fetch(`${API}/api/content?category=${key}`);
    const items = await res.json();
    if(!items.length){
      itemsEl.innerHTML = '<div class="empty"><span class="big">🕸</span>Bu bo\'limda hozircha kontent yo\'q</div>';
      return;
    }
    await attachFavStatus(items);
    itemsEl.innerHTML = items.map(cardHtml).join('');
  }catch(e){
    itemsEl.innerHTML = '<div class="empty">Xatolik yuz berdi. Qayta urinib ko\'ring.</div>';
  }
}

async function openFavorites(){
  thwip();
  document.getElementById('homeView').classList.add('hidden');
  const listView = document.getElementById('listView');
  listView.classList.add('active');
  document.getElementById('listTitle').textContent = '⭐ Sevimlilar';
  document.getElementById('listBanner').classList.remove('show');
  const itemsEl = document.getElementById('listItems');

  if(!USER_ID){
    itemsEl.innerHTML = '<div class="empty">Sevimlilarni ko\'rish uchun botni Telegram ichida oching.</div>';
    return;
  }
  itemsEl.innerHTML = '<div class="empty">Yuklanmoqda...</div>';
  try{
    const res = await fetch(`${API}/api/favorites?user_id=${USER_ID}`);
    const items = await res.json();
    if(!items.length){
      itemsEl.innerHTML = '<div class="empty"><span class="big">⭐</span>Hali hech narsa saqlamagansiz</div>';
      return;
    }
    items.forEach(it => it.is_favorite = true);
    itemsEl.innerHTML = items.map(cardHtml).join('');
  }catch(e){
    itemsEl.innerHTML = '<div class="empty">Xatolik yuz berdi.</div>';
  }
}

async function attachFavStatus(items){
  if(!USER_ID) return;
  try{
    const res = await fetch(`${API}/api/favorites?user_id=${USER_ID}`);
    const favs = await res.json();
    const favIds = new Set(favs.map(f => f.id));
    items.forEach(it => it.is_favorite = favIds.has(it.id));
  }catch(e){ /* jim o'tkazamiz */ }
}

async function toggleFavorite(id){
  if(!USER_ID){ tg?.HapticFeedback?.notificationOccurred('error'); return; }
  const btn = document.getElementById(`fav-${id}`);
  try{
    const res = await fetch(`${API}/api/favorite/toggle`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: USER_ID, content_id: id}),
    });
    const data = await res.json();
    btn.textContent = data.is_favorite ? '⭐' : '☆';
    btn.classList.toggle('active', data.is_favorite);
    tg?.HapticFeedback?.impactOccurred('light');
  }catch(e){}
}

// ---- Eng ko'p ko'rilgan ----
async function loadTop(){
  try{
    const res = await fetch(`${API}/api/top`);
    const items = await res.json();
    if(!items.length) return;
    document.getElementById('topSection').style.display = 'block';
    document.getElementById('topScroll').innerHTML = items.map(it => `
      <div class="top-card" onclick="sendItem(${it.id})">
        ${it.has_thumb
          ? `<img class="thumb" src="${API}/api/thumb/${it.id}" onerror="this.outerHTML='<div class=\\'thumb-fallback\\'>🕷</div>'" />`
          : `<div class="thumb-fallback">🕷</div>`}
        <div class="t-name">${escapeHtml(it.title)}</div>
        <div class="t-views">👁 ${it.views}</div>
      </div>
    `).join('');
  }catch(e){}
}

// ---- Qidiruv ----
let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  const resultsEl = document.getElementById('searchResults');
  const grid = document.getElementById('grid');
  const topSection = document.getElementById('topSection');
  if(!q){
    resultsEl.classList.remove('show');
    resultsEl.innerHTML = '';
    grid.style.display = '';
    if(document.getElementById('topScroll').innerHTML) topSection.style.display = 'block';
    return;
  }
  searchTimer = setTimeout(async () => {
    try{
      const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
      const items = await res.json();
      grid.style.display = 'none';
      topSection.style.display = 'none';
      resultsEl.classList.add('show');
      if(!items.length){
        resultsEl.innerHTML = '<div class="empty">🕸 Hech narsa topilmadi</div>';
        return;
      }
      await attachFavStatus(items);
      resultsEl.innerHTML = items.map(cardHtml).join('');
    }catch(e){
      resultsEl.innerHTML = '<div class="empty">Xatolik yuz berdi.</div>';
    }
  }, 350);
});

function sendItem(id){
  thwip();
  fetch(`${API}/api/view/${id}`, {method:'POST'}).catch(()=>{});
  tg?.sendData(JSON.stringify({action:'get_content', id}));
}

function showHome(){
  thwip();
  document.getElementById('homeView').classList.remove('hidden');
  document.getElementById('listView').classList.remove('active');
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---- osilib turuvchi "kiyim yorlig'i" uslubidagi dekorativ rasmlar ----
function loadHangTags(){
  const positions = [
    {top:'8%', left:'-4%', rot:'-8deg'},
    {top:'22%', right:'-5%', rot:'10deg'},
    {top:'48%', left:'-6%', rot:'6deg'},
    {top:'65%', right:'-4%', rot:'-9deg'},
    {top:'85%', left:'-3%', rot:'7deg'},
  ];
  const test = new Image();
  const src = `${API}/api/banner/webapp_bg?t=${Date.now()}`;
  test.onload = () => {
    const container = document.getElementById('hangTags');
    container.innerHTML = positions.map(p => `
      <div class="hang-tag" style="top:${p.top};${p.left ? `left:${p.left}` : `right:${p.right}`};transform:rotate(${p.rot});">
        <div class="string"></div>
        <div class="hole"></div>
        <img src="${API}/api/banner/webapp_bg" alt="" />
      </div>
    `).join('');
  };
  test.onerror = () => {};
  test.src = src;
}
